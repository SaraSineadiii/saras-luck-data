name: Update lottery data

on:
  schedule:
    - cron: '20 5 * * *'    # ~00:20 US Eastern, after Mon/Wed/Sat draws
    - cron: '20 13 * * *'   # midday safety refresh
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build data.json
        run: node build.mjs
      - name: Commit if changed
        run: |
          git config user.name "saras-luck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json la-history.json scorecard.json
          if git diff --staged --quiet; then
            echo "No new draws."
          else
            git commit -m "data: refresh $(date -u +%F)"
            git push
          fi
